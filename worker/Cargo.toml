[package]
name = "worker"
version = "0.1.0"
edition = "2021"

[dependencies]
proto = { path = "../proto" }
tonic = "0.11"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "time"] }
prost = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.8", features = ["v4"] }
wasmtime = "20.0.0"
sysinfo = "0.30"
