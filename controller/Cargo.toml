[package]
name = "controller"
version = "0.1.0"
edition = "2021"

[dependencies]
proto = { path = "../proto" }
tonic = "0.11"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
prost = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.8", features = ["v4"] }
rand = "0.8"
axum = "0.6"
base64 = "0.21"
serde = { version = "1.0", features = ["derive"] }
